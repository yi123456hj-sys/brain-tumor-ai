<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BrainScan AI — 脑肿瘤智能分析系统</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050b18;--bg2:#080f1f;--card:#0d1829;--card2:#111e30;
  --border:rgba(100,180,255,.15);--border2:rgba(100,180,255,.08);
  --blue:#00b4ff;--blue2:#0070cc;--teal:#00e5cc;--green:#00d97e;
  --yellow:#ffd60a;--red:#ff4d6d;--orange:#ff9500;--purple:#a855f7;
  --text:#e8f0fe;--text2:#94a3b8;--text3:#4a5568;
  --glow:0 0 24px rgba(100,100,255,.25);--radius:16px;--radius2:12px
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Inter','Noto Sans SC','Noto Sans KR',sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(100,100,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(100,100,255,.03) 1px,transparent 1px);
  background-size:40px 40px;z-index:0}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#0a0f1e}
::-webkit-scrollbar-thumb{background:#1e3a5f;border-radius:3px}
.app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

/* Header */
header{background:rgba(5,11,24,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);
  padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:12px}
.logo-icon{width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,#1a0d4e,#2d0a6e);
  border:1px solid rgba(168,85,247,.4);display:flex;align-items:center;justify-content:center;
  font-size:18px;box-shadow:0 0 12px rgba(168,85,247,.3)}
.logo-text{font-size:18px;font-weight:700;color:#fff;letter-spacing:-.3px}
.logo-sub{font-size:11px;color:var(--purple);font-weight:500;letter-spacing:.5px;text-transform:uppercase}
.lang-btn{display:flex;background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.lang-btn button{padding:6px 12px;background:none;border:none;color:var(--text2);font-size:12px;font-weight:500;cursor:pointer;transition:all .2s}
.lang-btn button.active{background:var(--blue2);color:#fff}
.lang-btn button:hover:not(.active){background:rgba(168,85,247,.1);color:var(--purple)}

/* Main */
main{flex:1;padding:24px;max-width:1400px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:24px}
.workspace{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
@media(max-width:900px){.workspace{grid-template-columns:1fr}}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.card-header{padding:16px 20px;border-bottom:1px solid var(--border2);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:14px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px}
.card-title .icon{font-size:16px}
.card-body{padding:20px}

/* Upload */
.upload-zone{border:2px dashed var(--border);border-radius:var(--radius2);padding:40px 20px;text-align:center;
  cursor:pointer;transition:all .3s;position:relative;overflow:hidden;background:rgba(0,0,0,.2)}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--purple);background:rgba(168,85,247,.05);box-shadow:0 0 24px rgba(168,85,247,.2)}
.upload-zone.has-image{padding:0;border-style:solid;border-color:rgba(168,85,247,.3)}
.upload-icon{font-size:48px;margin-bottom:12px;display:block}
.upload-title{font-size:16px;font-weight:600;margin-bottom:6px}
.upload-sub{font-size:13px;color:var(--text2)}
.upload-hint{font-size:11px;color:var(--text3);margin-top:8px}
#file-input{display:none}

/* Image */
.img-wrap{position:relative;width:100%}
.img-wrap img{display:block;width:100%;max-height:480px;object-fit:contain;border-radius:calc(var(--radius2) - 2px)}
.img-overlay{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-start;padding:12px}
.img-badge{background:rgba(0,0,0,.7);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:11px;color:var(--text2)}
.canvas-overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;border-radius:calc(var(--radius2) - 2px)}

/* Button */
.btn-analyze{width:100%;margin-top:16px;padding:14px;
  background:linear-gradient(135deg,#6d28d9,#4c1d95);
  border:1px solid rgba(168,85,247,.4);border-radius:var(--radius2);
  color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:all .3s;
  position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-analyze:hover:not(:disabled){box-shadow:0 4px 20px rgba(109,40,217,.5);transform:translateY(-1px)}
.btn-analyze:disabled{opacity:.5;cursor:not-allowed}
.btn-analyze.loading{pointer-events:none}
.scan-line{position:absolute;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--purple),transparent);
  animation:scanDown 1.5s ease-in-out infinite;box-shadow:0 0 12px var(--purple)}
@keyframes scanDown{0%{top:-2px}100%{top:calc(100% + 2px)}}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* Results */
.result-empty{text-align:center;padding:48px 20px;color:var(--text3);display:flex;flex-direction:column;align-items:center;gap:12px}
.result-empty .big-icon{font-size:56px;opacity:.4}
.result-status{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border2)}
.status-badge{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700}
.status-badge.tumor{background:rgba(255,77,109,.15);border:1px solid rgba(255,77,109,.4);color:var(--red)}
.status-badge.normal{background:rgba(0,217,126,.15);border:1px solid rgba(0,217,126,.4);color:var(--green)}

/* Tumor type card */
.tumor-type-card{margin:16px 20px;padding:16px;
  background:linear-gradient(135deg,rgba(109,40,217,.15),rgba(76,29,149,.1));
  border:1px solid rgba(168,85,247,.2);border-radius:var(--radius2)}
.tumor-type-name{font-size:22px;font-weight:800;color:#fff;margin-bottom:4px}
.tumor-type-sub{font-size:13px;color:var(--purple)}

/* Metrics */
.metrics-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 20px 16px}
.metric-card{background:var(--card2);border:1px solid var(--border2);border-radius:var(--radius2);padding:12px;text-align:center}
.metric-label{font-size:11px;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.metric-val{font-size:20px;font-weight:800}
.metric-val.conf{color:var(--blue)}
.metric-val.sev-none{color:var(--green)}
.metric-val.sev-mild{color:var(--yellow)}
.metric-val.sev-moderate{color:var(--orange)}
.metric-val.sev-severe{color:var(--red)}
.metric-val.qual-poor{color:var(--red)}
.metric-val.qual-fair{color:var(--yellow)}
.metric-val.qual-good{color:var(--blue)}
.metric-val.qual-excellent{color:var(--green)}

/* Conf bar */
.conf-bar-wrap{padding:0 20px 16px}
.conf-bar-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:6px}
.conf-bar-bg{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.conf-bar-fill{height:100%;border-radius:3px;transition:width 1s cubic-bezier(.4,0,.2,1)}

/* Location */
.location-row{display:flex;gap:10px;padding:0 20px 16px;align-items:flex-start}
.loc-icon{font-size:18px;flex-shrink:0;margin-top:2px}

/* Observations */
.obs-section{margin:0 20px 16px;padding:14px;background:rgba(168,85,247,.05);border:1px solid rgba(168,85,247,.1);border-radius:var(--radius2)}
.obs-title{font-size:12px;font-weight:600;color:var(--purple);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.obs-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text2);margin-bottom:6px;line-height:1.5}
.obs-dot{width:6px;height:6px;border-radius:50%;background:var(--purple);flex-shrink:0;margin-top:5px}

/* Info */
.info-section{margin:0 20px 16px}
.info-grid{display:grid;grid-template-columns:1fr;gap:10px}
.info-item-title{font-size:11px;font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.info-item-text{font-size:13px;color:var(--text2);line-height:1.6}

/* Disclaimer */
.disclaimer{margin:0 20px 16px;padding:10px 14px;background:rgba(255,215,10,.05);border:1px solid rgba(255,215,10,.2);border-radius:8px;font-size:11px;color:rgba(255,215,10,.7);display:flex;align-items:flex-start;gap:8px}

/* Skeleton */
.skeleton{background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 75%);background-size:400% 100%;animation:shimmer 1.5s infinite;border-radius:6px}
@keyframes shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* History */
.history-section{margin-top:24px}
.history-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding:16px 20px}
.history-item{background:var(--card2);border:1px solid var(--border2);border-radius:var(--radius2);overflow:hidden;cursor:pointer;transition:all .2s}
.history-item:hover{border-color:var(--purple);transform:translateY(-2px);box-shadow:var(--glow)}
.history-thumb{width:100%;height:100px;object-fit:cover}
.history-info{padding:8px 10px}
.history-type{font-size:12px;font-weight:700;color:var(--text)}
.history-time{font-size:10px;color:var(--text3);margin-top:2px}
.history-empty{padding:20px;text-align:center;color:var(--text3);font-size:13px}

/* Bottom */
.bottom-bar{background:rgba(5,11,24,.9);border-top:1px solid var(--border2);padding:12px 24px;text-align:center;font-size:11px;color:var(--text3)}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--card2);border:1px solid var(--border);border-radius:12px;
  padding:12px 20px;display:flex;align-items:center;gap:10px;font-size:13px;
  box-shadow:0 8px 32px rgba(0,0,0,.4);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:999}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.error .toast-icon{color:var(--red)}
.toast.success .toast-icon{color:var(--green)}

@media(max-width:640px){
  header{padding:0 16px}
  main{padding:16px}
  .metrics-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="app">

<header>
  <div class="logo">
    <div class="logo-icon">🧠</div>
    <div>
      <div class="logo-text">BrainScan AI</div>
      <div class="logo-sub" data-i18n="subtitle">脑肿瘤智能分析系统</div>
    </div>
  </div>
  <div class="lang-btn">
    <button onclick="setLang('zh')" id="lang-zh" class="active">中文</button>
    <button onclick="setLang('en')" id="lang-en">EN</button>
    <button onclick="setLang('ko')" id="lang-ko">한국어</button>
  </div>
</header>

<main>
  <div class="workspace">
    <div class="card">
      <div class="card-header">
        <div class="card-title"><span class="icon">🩻</span><span data-i18n="upload_title">上传MRI影像</span></div>
        <span id="img-size-badge" style="font-size:11px;color:var(--text3)"></span>
      </div>
      <div class="card-body">
        <div class="upload-zone" id="upload-zone" onclick="document.getElementById('file-input').click()">
          <span class="upload-icon">📡</span>
          <div class="upload-title" data-i18n="upload_drop">拖拽或点击上传</div>
          <div class="upload-sub" data-i18n="upload_sub">支持 JPG · PNG · WEBP · BMP</div>
          <div class="upload-hint" data-i18n="upload_hint">建议使用标准脑部MRI影像，分辨率越高分析越准确</div>
        </div>
        <input type="file" id="file-input" accept="image/*" onchange="handleFileSelect(event)">
        <button class="btn-analyze" id="btn-analyze" onclick="startAnalysis()" disabled>
          <span id="btn-icon">🔍</span>
          <span id="btn-text" data-i18n="btn_analyze">开始AI分析</span>
        </button>
      </div>
    </div>

    <div class="card" id="result-card">
      <div class="card-header">
        <div class="card-title"><span class="icon">📊</span><span data-i18n="result_title">分析结果</span></div>
        <div id="result-quality-badge" style="display:none;font-size:11px;padding:3px 8px;border-radius:6px;background:rgba(168,85,247,.1);border:1px solid rgba(168,85,247,.2);color:var(--purple)"></div>
      </div>
      <div id="result-body">
        <div class="result-empty" id="result-placeholder">
          <div class="big-icon">🔬</div>
          <div style="font-size:14px;font-weight:500;color:var(--text2)" data-i18n="result_placeholder">上传MRI影像后点击分析</div>
          <div style="font-size:12px" data-i18n="result_placeholder_sub">AI将自动识别肿瘤类型、位置和特征</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card history-section" id="history-section" style="display:none">
    <div class="card-header">
      <div class="card-title"><span class="icon">🗂</span><span data-i18n="history_title">分析历史</span></div>
      <button onclick="clearHistory()" style="font-size:11px;color:var(--text3);background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:6px" onmouseover="this.style.color='var(--red)'" onmouseout="this.style.color='var(--text3)'" data-i18n="history_clear">清除历史</button>
    </div>
    <div class="history-grid" id="history-grid"></div>
  </div>
</main>

<div class="bottom-bar">
  <span data-i18n="disclaimer">⚠ 本系统仅供教育与研究参考，不作为临床诊断依据。请咨询专业医疗人员。</span>
</div>

<div class="toast" id="toast">
  <span class="toast-icon" id="toast-icon">ℹ</span>
  <span id="toast-msg"></span>
</div>

<script>
const GEMINI_KEY = '';
const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_KEY}`;

// Find the brightest compact cluster in the image (contrast-enhanced tumor = brightest spot)
function analyzeImageForRegions(imgEl) {
  const W = 128, H = 128;
  const offscreen = document.createElement('canvas');
  offscreen.width = W; offscreen.height = H;
  const ctx = offscreen.getContext('2d');
  ctx.drawImage(imgEl, 0, 0, W, H);
  const data = ctx.getImageData(0, 0, W, H).data;

  const margin = Math.floor(W * 0.08);
  const gray = new Float32Array(W * H);
  for (let y = 0; y < H; y++)
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      gray[y * W + x] = 0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2];
    }

  // Apply Gaussian-like blur to suppress noise, find smoothed max
  const blurred = new Float32Array(W * H);
  const kr = 3;
  for (let y = margin; y < H-margin; y++)
    for (let x = margin; x < W-margin; x++) {
      let s = 0, c = 0;
      for (let dy = -kr; dy <= kr; dy++)
        for (let dx = -kr; dx <= kr; dx++) {
          const ny = y+dy, nx = x+dx;
          if (ny>=0&&ny<H&&nx>=0&&nx<W) { s += gray[ny*W+nx]; c++; }
        }
      blurred[y*W+x] = s/c;
    }

  // Find global maximum in blurred image (= tumor center)
  let maxVal = 0, peakX = W/2, peakY = H/2;
  for (let y = margin; y < H-margin; y++)
    for (let x = margin; x < W-margin; x++)
      if (blurred[y*W+x] > maxVal) { maxVal = blurred[y*W+x]; peakX = x; peakY = y; }

  // Flood-fill from peak: collect connected pixels above 70% of peak value
  const threshold = maxVal * 0.70;
  const visited = new Uint8Array(W * H);
  const queue = [[peakX, peakY]];
  visited[peakY*W+peakX] = 1;
  let minX = peakX, maxX = peakX, minY = peakY, maxY = peakY;
  let filled = 0;

  while (queue.length > 0 && filled < 2000) {
    const [cx, cy] = queue.shift();
    filled++;
    if (cx < minX) minX=cx; if (cx > maxX) maxX=cx;
    if (cy < minY) minY=cy; if (cy > maxY) maxY=cy;
    for (const [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1]]) {
      const nx=cx+dx, ny=cy+dy;
      if (nx>=margin&&nx<W-margin&&ny>=margin&&ny<H-margin&&!visited[ny*W+nx]&&blurred[ny*W+nx]>=threshold) {
        visited[ny*W+nx]=1; queue.push([nx,ny]);
      }
    }
  }

  const cx = (minX+maxX)/2/W;
  const cy = (minY+maxY)/2/H;
  const rw = Math.max((maxX-minX)/W, 0.08);
  const rh = Math.max((maxY-minY)/H, 0.08);
  return { cx, cy, rw, rh };
}

function getDemoResult() {
  const imgEl = document.getElementById('preview-img');
  const types = ['glioma','meningioma','pituitary','notumor'];
  const type = types[Math.floor(Math.random() * types.length)];
  const detected = type !== 'notumor';
  const conf = detected ? 80 + Math.floor(Math.random() * 15) : 88 + Math.floor(Math.random() * 10);
  const sevMap = { glioma:'severe', meningioma:'moderate', pituitary:'mild', notumor:'none' };
  const locMap = {
    glioma:{en:'Right temporal lobe, extending to parietal region',zh:'右侧颞叶，延伸至顶叶区域'},
    meningioma:{en:'Left frontal convexity, extra-axial mass',zh:'左侧额叶凸面，轴外占位性病变'},
    pituitary:{en:'Sellar/suprasellar region, pituitary fossa',zh:'鞍区/鞍上区，垂体窝'},
    notumor:{en:'No focal lesion identified',zh:'未发现局灶性病变'},
  };
  const obsMap = {
    glioma:{en:['Irregular hypointense core with peripheral enhancement','Surrounding vasogenic edema in T2/FLAIR','Mass effect with midline shift ~4mm'],zh:['不规则低信号核心伴周边强化','T2/FLAIR序列周围血管源性水肿','占位效应伴中线移位约4mm']},
    meningioma:{en:['Well-defined extra-axial homogeneous mass','Intense homogeneous contrast enhancement','Dural tail sign present'],zh:['边界清晰的轴外均匀性占位','均匀明显强化','可见脑膜尾征']},
    pituitary:{en:['Sellar mass with suprasellar extension','Optic chiasm compression noted','Heterogeneous signal on T1 post-contrast'],zh:['鞍区占位伴鞍上区延伸','视交叉受压','T1增强后信号不均匀']},
    notumor:{en:['No abnormal signal intensity detected','Normal cortical and subcortical structures','Ventricles and sulci appear normal for age'],zh:['未检测到异常信号强度','皮质和皮质下结构正常','脑室和脑沟与年龄相符']},
  };

  // Use pixel analysis to place bboxes on actual bright regions
  let bboxes = [];
  if (detected && imgEl) {
    try {
      const region = analyzeImageForRegions(imgEl);
      const cx = region.cx, cy = region.cy;
      const rw = region.rw || 0.18, rh = region.rh || 0.18;
      const pad = 0.03;
      const x1 = Math.max(0.02, cx - rw/2 - pad);
      const y1 = Math.max(0.02, cy - rh/2 - pad);
      const w1 = Math.min(rw + pad*2, 0.70);
      const h1 = Math.min(rh + pad*2, 0.70);
      // outer edema box (slightly larger)
      const ex = Math.max(0.01, x1 - 0.04), ey = Math.max(0.01, y1 - 0.04);
      const ew = Math.min(w1 + 0.08, 0.85), eh = Math.min(h1 + 0.08, 0.85);
      const edemaLabels = { glioma:{zh:'水肿区域',en:'Edema Zone'}, meningioma:{zh:'脑膜附着',en:'Dural Tail'}, pituitary:{zh:'鞍上延伸',en:'Suprasellar Ext.'} };
      const eLabel = edemaLabels[type] || {zh:'异常区域',en:'Abnormal Zone'};
      bboxes = [
        {label:'肿瘤区域',label_en:'Tumor Region',confidence:conf,color:'red',x:x1,y:y1,w:w1,h:h1},
        {label:eLabel.zh,label_en:eLabel.en,confidence:conf-7,color:'yellow',x:ex,y:ey,w:ew,h:eh}
      ];
    } catch(e) {
      bboxes = [];
    }
  }

  return {
    detected, type, confidence: conf,
    severity: sevMap[type],
    location: locMap[type].en, location_zh: locMap[type].zh,
    observations: obsMap[type].en, observations_zh: obsMap[type].zh,
    quality: 'good', bboxes, _demo: true
  };
}

// ── i18n ──
const LANGS = {

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn button').forEach(b => b.classList.remove('active'));
  document.getElementById('lang-' + lang).classList.add('active');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (LANGS[lang][key]) el.textContent = LANGS[lang][key];
  });
  if (window._lastResult) renderResult(window._lastResult);
}
function t(key) { return LANGS[currentLang][key] || LANGS.en[key] || key; }

function setupDragDrop() {
  const zone = document.getElementById('upload-zone');
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) loadImageFile(file);
  });
}

function handleFileSelect(e) {
  const file = e.target.files[0];
  if (file) loadImageFile(file);
}

function loadImageFile(file) {
  currentMime = file.type || 'image/jpeg';
  const reader = new FileReader();
  reader.onload = ev => {
    const dataUrl = ev.target.result;
    currentImage = dataUrl.split(',')[1];
    showImagePreview(dataUrl, file.name, file.size);
    document.getElementById('btn-analyze').disabled = false;
    showToast(t('toast_upload'), 'success');
  };
  reader.readAsDataURL(file);
}

function showImagePreview(dataUrl, name, size) {
  const zone = document.getElementById('upload-zone');
  zone.classList.add('has-image');
  zone.onclick = null;
  zone.innerHTML = `
    <div class="img-wrap">
      <img src="${dataUrl}" id="preview-img" alt="MRI preview">
      <canvas class="canvas-overlay" id="result-canvas"></canvas>
      <div class="img-overlay">
        <div class="img-badge">📎 ${name}${size ? ' · ' + (size/1024).toFixed(1) + 'KB' : ''}</div>
      </div>
    </div>`;
  zone.addEventListener('click', () => document.getElementById('file-input').click(), {once:true});
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) loadImageFile(file);
  });
}

async function startAnalysis() {
  if (!currentImage) { showToast(t('err_no_img'), 'error'); return; }
  setAnalyzingState(true);
  showLoadingSkeleton();

  try {
    if (!GEMINI_KEY) {
      await new Promise(r => setTimeout(r, 2200));
      const result = getDemoResult();
      window._lastResult = result;
      renderResult(result);
      drawBBoxes(result.bboxes || []);
      saveHistory(result);
      showToast('演示模式：' + t('toast_success'), 'success');
      setAnalyzingState(false);
      return;
    }

    const res = await fetch(GEMINI_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{
          parts: [
            { inline_data: { mime_type: currentMime, data: currentImage } },
            { text: `You are a professional neuroradiology AI. Carefully analyze this brain MRI image.
Return ONLY valid JSON, no markdown, no explanation:
{"detected":true_or_false,"type":"glioma|meningioma|pituitary|notumor|unclear","confidence":0-100,"severity":"none|mild|moderate|severe","location":"precise anatomical location in English","location_zh":"精确解剖位置（中文）","observations":["finding 1","finding 2","finding 3"],"observations_zh":["发现1","发现2","发现3"],"quality":"poor|fair|good|excellent","bboxes":[{"label":"肿瘤区域","label_en":"Tumor Region","confidence":0-100,"color":"red","x":0.0,"y":0.0,"w":0.1,"h":0.1},{"label":"异常信号","label_en":"Abnormal Signal","confidence":0-100,"color":"yellow","x":0.0,"y":0.0,"w":0.1,"h":0.1}]}
For bboxes: x,y=top-left, w,h=width/height, all fractions 0.0-1.0. 1-3 tight boxes on tumor regions. Empty array if no tumor.` }
          ]
        }],
        generationConfig: { temperature: 0.1, maxOutputTokens: 1024 }
      })
    });

    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData.error?.message || `HTTP ${res.status}`);
    }

    const data = await res.json();
    let raw = data.candidates[0].content.parts[0].text
      .replace(/^```json?\s*/,'').replace(/\s*```$/,'').trim();

    let result;
    try { result = JSON.parse(raw); }
    catch { throw new Error(t('err_parse')); }

    window._lastResult = result;
    renderResult(result);
    drawBBoxes(result.bboxes || []);
    saveHistory(result);
    showToast(t('toast_success'), 'success');

  } catch (err) {
    showResultError(err.message);
    showToast(t('err_api') + ': ' + err.message, 'error');
  } finally {
    setAnalyzingState(false);
  }
}

// ── Bounding Box Overlay ──
function drawBBoxes(bboxes) {
  const img = document.getElementById('preview-img');
  const canvas = document.getElementById('result-canvas');
  if (!img || !canvas || !bboxes || bboxes.length === 0) return;

  function render() {
    const dispW = img.clientWidth;
    const dispH = img.clientHeight;
    canvas.width = dispW;
    canvas.height = dispH;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, dispW, dispH);

    const imgAspect = (img.naturalWidth || dispW) / (img.naturalHeight || dispH);
    const canvasAspect = dispW / dispH;
    let renderW, renderH, offsetX, offsetY;
    if (imgAspect > canvasAspect) {
      renderW = dispW; renderH = dispW / imgAspect;
      offsetX = 0; offsetY = (dispH - renderH) / 2;
    } else {
      renderH = dispH; renderW = dispH * imgAspect;
      offsetX = (dispW - renderW) / 2; offsetY = 0;
    }

    const COLORS = { red:'#ff4d6d', blue:'#00b4ff', green:'#00d97e', yellow:'#ffd60a', purple:'#a855f7' };

    bboxes.forEach(box => {
      const color = COLORS[box.color] || '#a855f7';
      const x = offsetX + box.x * renderW;
      const y = offsetY + box.y * renderH;
      const w = box.w * renderW;
      const h = box.h * renderH;
      const conf = box.confidence || 0;
      const label = (currentLang === 'en' ? box.label_en : box.label) || box.label_en || box.label;

      ctx.save();
      ctx.shadowColor = color;
      ctx.shadowBlur = 14;
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, w, h);

      const cs = Math.min(w, h) * 0.15;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x, y+cs); ctx.lineTo(x, y); ctx.lineTo(x+cs, y);
      ctx.moveTo(x+w-cs, y); ctx.lineTo(x+w, y); ctx.lineTo(x+w, y+cs);
      ctx.moveTo(x+w, y+h-cs); ctx.lineTo(x+w, y+h); ctx.lineTo(x+w-cs, y+h);
      ctx.moveTo(x+cs, y+h); ctx.lineTo(x, y+h); ctx.lineTo(x, y+h-cs);
      ctx.stroke();
      ctx.restore();

      const fontSize = Math.max(11, Math.min(14, renderW * 0.025));
      ctx.font = `bold ${fontSize}px Inter, sans-serif`;
      const labelText = `${label} ${conf}%`;
      const textW = ctx.measureText(labelText).width + 10;
      const textH = fontSize + 8;
      const labelY = y > textH + 4 ? y - textH - 2 : y + 2;

      ctx.save();
      ctx.fillStyle = color + 'cc';
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x, labelY, textW, textH, 4);
      else ctx.rect(x, labelY, textW, textH);
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = '#fff';
      ctx.font = `bold ${fontSize}px Inter, sans-serif`;
      ctx.fillText(labelText, x + 5, labelY + textH - 5);
    });
  }

  if (img.complete && img.naturalWidth > 0) render();
  else img.onload = render;
  window._bboxData = bboxes;
  window.addEventListener('resize', () => { if (window._bboxData) drawBBoxes(window._bboxData); }, {once:true});
}

// ── History ──
function saveHistory(result) {
  if (!currentImage) return;
  const entry = { id:Date.now(), time:new Date().toLocaleString(), type:result.type,
    confidence:result.confidence, detected:result.detected,
    thumb:'data:'+currentMime+';base64,'+currentImage, result };
  history.unshift(entry);
  if (history.length > 8) history = history.slice(0, 8);
  localStorage.setItem('bsai-brain-history', JSON.stringify(history));
  renderHistory();
}

function renderHistory() {
  const section = document.getElementById('history-section');
  const grid = document.getElementById('history-grid');
  if (history.length === 0) { section.style.display='none'; return; }
  section.style.display = 'block';
  const info = (type) => (TUMOR_INFO[type] || TUMOR_INFO.unclear)[currentLang] || (TUMOR_INFO[type] || TUMOR_INFO.unclear).en;
  grid.innerHTML = history.map(h => `
    <div class="history-item" onclick="loadHistoryItem(${h.id})">
      <img class="history-thumb" src="${h.thumb}" alt="">
      <div class="history-info">
        <div class="history-type">${info(h.type).name}</div>
        <div class="history-time">${h.confidence}% · ${h.time}</div>
      </div>
    </div>`).join('');
}

function loadHistoryItem(id) {
  const h = history.find(x => x.id === id);
  if (!h) return;
  currentImage = h.thumb.split(',')[1];
  currentMime = h.thumb.split(':')[1].split(';')[0];
  showImagePreview(h.thumb, 'history', 0);
  document.getElementById('btn-analyze').disabled = false;
  window._lastResult = h.result;
  renderResult(h.result);
  setTimeout(() => drawBBoxes(h.result.bboxes || []), 50);
}

function clearHistory() {
  history = [];
  localStorage.removeItem('bsai-brain-history');
  renderHistory();
}

function showToast(msg, type = 'info') {
  const toast = document.getElementById('toast');
  const icon = document.getElementById('toast-icon');
  const msgEl = document.getElementById('toast-msg');
  clearTimeout(toastTimer);
  toast.className = 'toast ' + type;
  icon.textContent = type==='error'?'✕':type==='success'?'✓':'ℹ';
  msgEl.textContent = msg;
  toast.classList.add('show');
  toastTimer = setTimeout(() => toast.classList.remove('show'), 3500);
}
</script>
